name: PHP

on:
  push:
  pull_request:

jobs:

  php-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: cd php && composer install --no-interaction

      - name: Bootstrap PHP tooling
        run: bin/bootstrap_php.sh

      - name: PHPCS
        run: cd php && vendor/bin/phpcs

      - name: PHPStan
        run: cd php && vendor/bin/phpstan analyse

      - name: PHPUnit
        run: cd php && vendor/bin/phpunit

      - name: Deptrac
        run: cd php && vendor/bin/deptrac analyse