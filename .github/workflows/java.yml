name: Java

on:
  push:
  pull_request:

jobs:

  java-tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: java

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: mvn test
