services:

  hexagonal_php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hexagonal_php
    volumes:
      - ./php:/var/www/php
    working_dir: /var/www/php
    ports:
      - "8081:8080"
    depends_on:
      - database

  app_java:
    build:
      context: .
      dockerfile: docker/java/Dockerfile
    container_name: app_java
    volumes:
      - ./java:/app
    working_dir: /app
    ports:
      - "8082:8080"
    depends_on:
      - database

  database:
    image: postgres:16
    container_name: database
    restart: always
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
